<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Crypto Strategy Lab</title>
<style>
:root{--bg:#0b0f17;--c:#151c2a;--t:#e8edf5;--m:#8b97ab;--g:#2ecc8f;--r:#ff5d6c;--a:#f0b90b;--l:#263146;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f9;--c:#fff;--t:#111827;--m:#5b6678;--l:#dde3ee;color-scheme:light}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) 12px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:14px 0 2px}h2{font-size:16px;margin:18px 0 8px}small,.m{color:var(--m)}

.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}th,td{padding:6px 8px;border-bottom:1px solid var(--l);text-align:right}th:first-child,td:first-child{text-align:left}
.g{color:var(--g)}.r{color:var(--r)}.b{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700}.bg{background:#2ecc8f33;color:var(--g)}.br{background:#ff5d6c33;color:var(--r)}
canvas{width:100%;height:200px;display:block}.hide{display:none}#msg{color:var(--a)}pre{white-space:pre-wrap;font-size:12px}
</style></head><body>
<h1>SOL Trading Strategy Lab</h1><small>Binance Spot · SOLUSDT · Backtest เท่านั้น ไม่ส่งคำสั่งซื้อขายจริง ไม่ใช้ API Key</small>
<div class="tabs" id="tabs"></div>
<section id="p0"><div class="card"><div class="grid">
<div><label>เงินทุนเริ่มต้น (USDT)</label><input id="cap" type="number" value="10"></div>
<div><label>เงินต่อออเดอร์ (USDT)</label><input id="sz" type="number" value="5"></div>
<div><label>คู่เทรด</label><input id="sym" value="SOLUSDT" autocapitalize="characters" autocorrect="off" spellcheck="false"></div>
<div><label>Timeframe</label><select id="tf"><option>15m</option><option selected>1h</option><option>4h</option></select></div>
<div><label>ย้อนหลัง</label><select id="days"><option value="90">90 วัน</option><option value="180">180 วัน</option><option value="365" selected>365 วัน</option><option value="730">2 ปี</option><option value="1095">3 ปี</option></select></div>
<div><label>Fee ต่อด้าน (%)</label><input id="fee" type="number" step="0.01" value="0.10"></div>
<div><label>Slippage ต่อด้าน (%)</label><input id="slp" type="number" step="0.01" value="0.05"></div></div>
<button id="go">Start Backtest</button><button class="s" id="cmp">Compare Strategies</button><button class="s" id="rst">Reset</button>
<p id="msg"></p><small id="src"></small></div></section>
<section id="p1" class="hide"><div id="res"></div></section>
<section id="p2" class="hide"><div class="card"><select id="tsel"></select><button class="s" id="csv">Export CSV</button><button class="s" id="dl">Download ผล (JSON)</button><div class="w" id="th"></div></div></section>
<section id="p3" class="hide"><div class="card" id="guide"></div></section>
<script>
const $=s=>document.querySelector(s);let D=null,R=null;
['เริ่มต้น','ผลลัพธ์','Trade History','คู่มือ'].forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>tab(i);$('#tabs').append(b)});
function tab(i){[0,1,2,3].forEach(j=>{$('#p'+j).classList.toggle('hide',j!=i);$('#tabs').children[j].classList.toggle('on',j==i)})}tab(0);
const f2=(x,d=2)=>isFinite(x)?x.toFixed(d):'-',cl=x=>x>0?'g':x<0?'r':'';
// ---------- indicators ----------
const ema=(a,n)=>{const k=2/(n+1);let p=a[0];return a.map((x,i)=>p=i?x*k+p*(1-k):x)};
const sma=(a,n)=>{let s=0;return a.map((x,i)=>{s+=x;if(i>=n)s-=a[i-n];return i>=n-1?s/n:NaN})};
const sdv=(a,n)=>a.map((_,i)=>{if(i<n-1)return NaN;let m=0;for(let j=i-n+1;j<=i;j++)m+=a[j];m/=n;let v=0;for(let j=i-n+1;j<=i;j++)v+=(a[j]-m)**2;return Math.sqrt(v/n)});
const rma=(a,n)=>{let p=NaN;return a.map((x,i)=>{if(i<n-1)return NaN;if(i==n-1){let s=0;for(let j=0;j<n;j++)s+=a[j];return p=s/n}return p=(p*(n-1)+x)/n})};
function rsi(c,n=14){const u=[0],d=[0];for(let i=1;i<c.length;i++){const x=c[i]-c[i-1];u.push(Math.max(x,0));d.push(Math.max(-x,0))}const a=rma(u,n),b=rma(d,n);return a.map((x,i)=>b[i]==0?100:100-100/(1+x/b[i]))}
function atrF(h,l,c,n=14){return rma(h.map((x,i)=>i?Math.max(x-l[i],Math.abs(x-c[i-1]),Math.abs(l[i]-c[i-1])):x-l[i]),n)}
function adxF(h,l,c,n=14){const p=[0],m=[0];for(let i=1;i<h.length;i++){const u=h[i]-h[i-1],d=l[i-1]-l[i];p.push(u>d&&u>0?u:0);m.push(d>u&&d>0?d:0)}const at=atrF(h,l,c,n),P=rma(p,n),M=rma(m,n);const dx=P.map((x,i)=>{const a=100*x/at[i],b=100*M[i]/at[i];return isNaN(a)?0:100*Math.abs(a-b)/((a+b)||1)});return rma(dx,n)}
function supert(h,l,c,at,m){const n=c.length,dir=Array(n).fill(1);let fu=NaN,fl=NaN;for(let i=0;i<n;i++){if(isNaN(at[i]))continue;const md=(h[i]+l[i])/2,bu=md+m*at[i],bl=md-m*at[i],pu=fu,pl=fl,pc=c[i-1];fu=(isNaN(pu)||bu<pu||pc>pu)?bu:pu;fl=(isNaN(pl)||bl>pl||pc<pl)?bl:pl;if(i>0){dir[i]=dir[i-1];if(dir[i-1]==-1&&c[i]>pu)dir[i]=1;else if(dir[i-1]==1&&c[i]<pl)dir[i]=-1}}return dir}
// ---------- data ----------
const EP=['https://data-api.binance.vision','https://api.binance.com','https://api1.binance.com'];
async function load(sym,tf,days){let err,base;const errs=[];for(const e of EP){try{const r=await fetch(e+'/api/v3/klines?symbol='+sym+'&interval='+tf+'&limit=1',{cache:'no-store'});if(r.ok){base=e;break}if(r.status==400)throw new Error('ไม่พบคู่เทรด '+sym+' บน Binance Spot');err=r.status;errs.push(e.replace('https://','')+' → HTTP '+r.status)}catch(x){if(x.message.startsWith('ไม่พบ'))throw x;err=x.message;errs.push(e.replace('https://','')+' → '+x.message)}}
if(!base)throw new Error('เชื่อมต่อ Binance ไม่ได้\n'+errs.join('\n')+'\nหน้านี้เปิดจาก: '+location.protocol+'//'+(location.host||'(ไฟล์ในเครื่อง)')+'\nต้องเปิดผ่านลิงก์ https ที่ deploy แล้ว (เช่น Netlify) ไม่ใช่จากแชทหรือแอป Files');
let t=Date.now()-days*864e5,rows=[];const now=Date.now();
while(t<now){const r=await fetch(`${base}/api/v3/klines?symbol=${sym}&interval=${tf}&startTime=${t}&limit=1000`);if(!r.ok)throw new Error('Binance HTTP '+r.status);const j=await r.json();if(!j.length)break;rows.push(...j);t=j[j.length-1][6]+1;$('#msg').textContent='ดึงข้อมูล '+rows.length+' แท่ง...';if(j.length<1000)break}
rows=rows.filter(x=>x[6]<Date.now());// เฉพาะแท่งที่ปิดแล้ว
const d={t:rows.map(x=>x[0]),o:rows.map(x=>+x[1]),h:rows.map(x=>+x[2]),l:rows.map(x=>+x[3]),c:rows.map(x=>+x[4]),v:rows.map(x=>+x[5]),src:base,at:new Date()};
if(d.t.length<600)throw new Error('ข้อมูลน้อยเกินไป ('+d.t.length+' แท่ง)');return d}
// ---------- signals ----------
function mk(d){const{o,h,l,c,v}=d,N=c.length,I={e20:ema(c,20),e50:ema(c,50),e200:ema(c,200),rsi:rsi(c),adx:adxF(h,l,c),atr:atrF(h,l,c),vs:sma(v,20),mid:sma(c,20),sd:sdv(c,20)};
const mf=ema(c,12),ms=ema(c,26),mac=mf.map((x,i)=>x-ms[i]),sg=ema(mac,9);I.hist=mac.map((x,i)=>x-sg[i]);I.st=supert(h,l,c,atrF(h,l,c,10),3);
const R=(f)=>{const s=Array(N).fill(false);for(let i=201;i<N;i++)s[i]=!!f(i);return s};
return[
{k:'A',n:'Trend Pullback',pn:'ADX≥',g:[15,20,25],f:p=>R(i=>I.e50[i]>I.e200[i]&&c[i]>I.e200[i]&&c[i]>I.e20[i]&&c[i-1]<=I.e20[i-1]&&I.adx[i]>=p&&I.rsi[i]>45&&I.rsi[i]<70)},
{k:'B',n:'RSI Mean Reversion',pn:'RSI<',g:[25,30,35,40],f:p=>R(i=>I.rsi[i-1]<p&&I.rsi[i]>I.rsi[i-1]&&c[i-1]<=I.mid[i-1]-1.5*I.sd[i-1]*1.0+I.sd[i-1]*0.0&&c[i]>o[i]&&I.adx[i]<25)},
{k:'C',n:'Bollinger Reversal',pn:'BB σ',g:[1.5,2,2.5],f:p=>R(i=>c[i-1]<I.mid[i-1]-p*I.sd[i-1]&&c[i]>I.mid[i]-p*I.sd[i]&&I.rsi[i]>I.rsi[i-1]&&v[i]>I.vs[i])},
{k:'D',n:'Supertrend',pn:'RSI>',g:[45,50,55],f:p=>R(i=>I.st[i]==1&&I.st[i-1]==-1&&c[i]>I.e200[i]&&I.rsi[i]>p)},
{k:'E',n:'MACD Momentum',pn:'Vol×',g:[0.8,1,1.3],f:p=>R(i=>I.hist[i]>0&&I.hist[i-1]<=0&&I.e50[i]>I.e200[i]&&c[i]>I.e50[i]&&v[i]>I.vs[i]*p)},
{k:'F',n:'Donchian Breakout',pn:'ช่อง',g:[20,40,55],f:p=>R(i=>{if(i<p)return 0;let m=0;for(let j=i-p;j<i;j++)m=Math.max(m,h[j]);return c[i]>m&&c[i]>I.e200[i]&&v[i]>I.vs[i]*1.2})}
].map(s=>({...s,I}))}
// ---------- simulator (spot long-only, 1 position) ----------
function sim(d,I,sig,a,b,P){const{o,h,l,c}=d,{sl,tp,hold,fee,slp,size}=P,T=[];let i=a;
while(i<b-1){if(!sig[i]||isNaN(I.atr[i])){i++;continue}
const raw=o[i+1],en=raw*(1+slp),q=size/en*(1-fee),S=raw-sl*I.atr[i],TP=raw+tp*I.atr[i];let j=i+1,px,why;
for(;j<b;j++){if(j>i+1&&o[j]<=S){px=o[j];why='SL gap';break}if(l[j]<=S){px=S;why='SL';break}if(j>i+1&&o[j]>=TP){px=o[j];why='TP gap';break}if(h[j]>=TP){px=TP;why='TP';break}if(j-i>=hold){px=c[j];why='Time';break}}
if(j>=b){j=b-1;px=c[j];why='End'}
const ex=px*(1-slp),pnl=q*ex*(1-fee)-size;T.push({ei:i+1,xi:j,entry:en,exit:ex,pnl,pct:pnl/size*100,why});i=j}
return T}
function M(t,cap){let w=0,l=0,nw=0,nl=0,st=0,ms=0,eq=cap,pk=cap,dd=0;const e=[cap],dc=[0];for(const x of t){if(x.pnl>0){w+=x.pnl;nw++;st=0}else{l-=x.pnl;nl++;ms=Math.max(ms,++st)}eq+=x.pnl;e.push(eq);pk=Math.max(pk,eq);const q=(pk-eq)/cap*100;dc.push(q);dd=Math.max(dd,q)}
const n=t.length,net=w-l;return{n,wr:n?nw/n*100:0,pf:l?w/l:(w?99:0),net,roi:net/cap*100,dd,exp:n?net/n:0,aw:nw?w/nw:0,al:nl?-l/nl:0,ms,e,dc}}
// ---------- optimize ----------
const wait=()=>new Promise(r=>setTimeout(r,0));
async function run(){const cap=+$('#cap').value,size=Math.min(+$('#sz').value,cap),fee=+$('#fee').value/100,slp=+$('#slp').value/100;
if(!(cap>0&&size>0))throw new Error('ใส่เงินทุนให้ถูกต้อง');
const SYM=($('#sym').value||'').trim().toUpperCase();if(!/^[A-Z0-9]{5,20}$/.test(SYM))throw new Error('ชื่อคู่เทรดไม่ถูกต้อง เช่น BTCUSDT');D=await load(SYM,$('#tf').value,+$('#days').value);const N=D.c.length,a0=201,a=a0+Math.floor((N-a0)*.6),b=a0+Math.floor((N-a0)*.8);
const dt=i=>new Date(D.t[i]).toISOString().slice(0,10),seg=(x,y)=>({from:dt(x),to:dt(y-1),chg:(D.c[y-1]/D.c[x]-1)*100,n:y-x});
const out=[],base={fee,slp,size};
for(const S of mk(D)){$('#msg').textContent='ทดสอบ '+S.n+'...';await wait();let best=null;
for(const p of S.g){const sig=S.f(p);for(const sl of[1,1.5,2])for(const tp of[1,1.5,2.5])for(const hold of[20,60]){const P={...base,sl,tp,hold},tr=M(sim(D,S.I,sig,a0,a,P),cap),va=M(sim(D,S.I,sig,a,b,P),cap);
const ok=tr.n>=5&&va.n>=3&&tr.net>0&&va.net>0,sc=ok?va.wr+20*Math.min(va.pf,3):-1e6+va.exp*100;if(!best||sc>best.sc)best={sc,p,sig,P,tr,va}}}
const{p,sig,P}=best,all=sim(D,S.I,sig,a0,N,P),oT=sim(D,S.I,sig,b,N,P),oos=M(oT,cap),full=M(all,cap);
const hard=M(sim(D,S.I,sig,b,N,{...P,fee:fee*2,slp:slp*2}),cap),near=[];
for(const q of S.g.filter(z=>z!=p).slice(0,2))near.push(M(sim(D,S.I,S.f(q),b,N,P),cap).net);
const cr=[['OOS Net>0',oos.net>0],['OOS PF>1.5',oos.pf>1.5],['OOS Expectancy>0',oos.exp>0],['OOS MaxDD≤10%',oos.dd<=cap*0.1/cap*100],['เทรด≥100 (ทั้งช่วง)',full.n>=100],['OOS ไม่พังเทียบ Train (WR ห่าง≤15จุด และ Net>0)',oos.net>0&&Math.abs(oos.wr-best.tr.wr)<=15],['ทน Fee/Slip ×2 (Net>0)',hard.net>0]];
out.push({k:S.k,n:S.n,pn:S.pn,p,P:{sl:P.sl,tp:P.tp,hold:P.hold},tr:best.tr,va:best.va,oos,full,hard,near,cr,pass:cr.every(x=>x[1]),trades:all,oosT:oT,wd:wd(all,cap)})}
const rk=x=>(x.pass?1e6:0)+x.cr.filter(c=>c[1]).length*1e3+x.oos.net*10;out.sort((x,y)=>rk(y)-rk(x));
R={sym:SYM,cap,size,fee,slp,tf:$('#tf').value,days:+$('#days').value,seg:{train:seg(a0,a),val:seg(a,b),oos:seg(b,N)},range:[dt(0),dt(N-1)],N,out,at:D.at.toISOString(),src:D.src};return R}
function wd(t,cap){const nm=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'],g=nm.map(()=>[]);t.forEach(x=>g[new Date(D.t[x.ei]+7*36e5).getUTCDay()].push(x));return nm.map((n,i)=>({...M(g[i],cap),name:n}))}
// ---------- charts ----------
function cv(h=200){const c=document.createElement('canvas');c.style.height=h+'px';return c}
function draw(c,fn){requestAnimationFrame(()=>{const r=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*r;c.height=h*r;const x=c.getContext('2d');x.scale(r,r);x.font='10px sans-serif';fn(x,w,h)})}
function lineC(c,ss,tt){draw(c,(x,w,h)=>{let lo=1e18,hi=-1e18;ss.forEach(s=>s.y.forEach(v=>{lo=Math.min(lo,v);hi=Math.max(hi,v)}));if(hi==lo)hi=lo+1;const X=(i,n)=>30+(w-36)*i/Math.max(n-1,1),Y=v=>h-14-(h-24)*(v-lo)/(hi-lo);x.fillStyle='#8b97ab';x.fillText(f2(hi),0,10);x.fillText(f2(lo),0,h-4);ss.forEach(s=>{x.strokeStyle=s.c;x.lineWidth=1.5;x.beginPath();const st=Math.max(1,Math.floor(s.y.length/500));s.y.forEach((v,i)=>{if(i%st)return;i?x.lineTo(X(i,s.y.length),Y(v)):x.moveTo(X(i,s.y.length),Y(v))});x.stroke();(s.m||[]).forEach(m=>{x.fillStyle=m.c;x.beginPath();const px=X(m.i,s.y.length),py=Y(s.y[m.i]);x.arc(px,py,2.5,0,7);x.fill()})});if(tt){x.fillStyle='#8b97ab';x.fillText(tt,34,10)}})}
function barC(c,lab,val,fmt=f2){draw(c,(x,w,h)=>{const mx=Math.max(...val.map(Math.abs),1e-9),bw=(w-10)/val.length;x.strokeStyle='#8b97ab';x.beginPath();x.moveTo(0,h/2);x.lineTo(w,h/2);x.stroke();val.forEach((v,i)=>{x.fillStyle=v>=0?'#2ecc8f':'#ff5d6c';const bh=(h/2-18)*Math.abs(v)/mx;x.fillRect(5+i*bw+3,v>=0?h/2-bh:h/2,bw-6,bh);x.fillStyle='#8b97ab';x.textAlign='center';x.fillText(lab[i],5+i*bw+bw/2,h-3);x.fillText(fmt(v),5+i*bw+bw/2,v>=0?h/2-bh-3:h/2+bh+10)});x.textAlign='left'})}
// ---------- render ----------
function ren(){const r=R,w=r.out.find(x=>x.pass),best=r.out[0],T=(x,y)=>`${x.from} → ${x.to} (${f2(x.chg,1)}%)`;
const sel=(fn,cmp)=>r.out.reduce((a,b)=>cmp(fn(b),fn(a))?b:a);
const row=x=>`<tr><td><b>${x.k}</b> ${x.n}<br><small>${x.pn}${x.p} SL${x.P.sl}/TP${x.P.tp}×ATR · ${x.P.hold} แท่ง</small></td><td>${f2(x.oos.wr,1)}%</td><td>${f2(x.oos.pf)}</td><td class="${cl(x.oos.net)}">${f2(x.oos.net,3)}</td><td>${f2(x.oos.roi,1)}%</td><td>${f2(x.oos.dd,1)}%</td><td>${f2(x.oos.exp,3)}</td><td>${x.oos.n}/${x.full.n}</td><td>${f2(x.oos.aw,3)}/${f2(x.oos.al,3)}</td><td>${x.oos.ms}</td><td>${f2(x.tr.wr,0)}/${f2(x.va.wr,0)}%</td><td><span class="b ${x.pass?'bg':'br'}">${x.pass?'ผ่าน':'ไม่ผ่าน'}</span></td></tr>`;
$('#res').innerHTML=`<div class="card"><h2 style="margin-top:0">คำแนะนำ: ${w?`<span class="g">${w.k} ${w.n}</span>`:'<span class="r">WAIT / NO TRADE</span>'}</h2>${w?'ผ่านเกณฑ์ทั้งหมดบน Out-of-sample (ผลย้อนหลังไม่รับประกันอนาคต)':'ไม่พบกลยุทธ์ที่ผ่านเกณฑ์ครบทุกข้อ จึงไม่แนะนำให้เข้าเทรด (ตัวที่ดีที่สุด: '+best.k+' '+best.n+')'}
<p><small>ข้อมูล ${r.sym} ${r.tf} ${r.range[0]} ถึง ${r.range[1]} · ${r.N} แท่งที่ปิดแล้ว · ดึงเมื่อ ${r.at} จาก ${r.src}<br>Train ${T(r.seg.train)}<br>Validation ${T(r.seg.val)}<br>Out-of-sample ${T(r.seg.oos)}<br>Fee ${r.fee*100}% · Slippage ${r.slp*100}% ต่อด้าน · ทุน ${r.cap} / ออเดอร์ ${r.size} USDT. ยังไม่ได้ทำ Walk-forward เต็มรูปแบบ (ใช้ Train/Val/OOS + ทดสอบ Fee×2 + ขยับพารามิเตอร์แทน)</small></p></div>

function selfTest(){const P=5,fee=.001,slp=.0005,raw=100,en=raw*(1+slp),q=P/en*(1-fee),ex=101*(1-slp),pnl=q*ex*(1-fee)-P;return 'ตัวอย่างตรวจสอบ: ซื้อ 5 USDT ที่ Open 100 → เข้า '+en.toFixed(4)+', ได้ '+q.toFixed(6)+' SOL; ขายที่ 101 → ออก '+ex.toFixed(4)+', กำไรสุทธิ '+pnl.toFixed(5)+' USDT (หัก fee+slippage ทั้งสองด้าน แล้ว)'}
$('#guide').innerHTML=`<b>คู่มือใช้งาน</b><ol><li>ตั้งทุน/Timeframe/ช่วงเวลา แล้วกด Start Backtest (ต้องออนไลน์ ระบบดึงแท่งเทียนจริงจาก Binance Spot ไม่ต้องมี API Key)</li><li>ดูหน้า ผลลัพธ์: ตารางเทียบ 6 กลยุทธ์บน Out-of-sample, คำแนะนำ, กราฟ, วันในสัปดาห์ (เวลาไทย)</li><li>Trade History ดูทุกออเดอร์ ส่งออก CSV / JSON ได้</li></ol>
<b>กฎซื้อ (สัญญาณเมื่อแท่งปิด → เข้าที่ Open แท่งถัดไป)</b><ul><li><b>A Trend Pullback</b>: EMA50>EMA200, ราคา>EMA200, ราคากลับขึ้นเหนือ EMA20 จากด้านล่าง, ADX≥ค่าที่ทดสอบ, RSI 45–70</li><li><b>B RSI Reversion</b>: RSI แท่งก่อน<ค่า oversold และ RSI เด้งขึ้น, ราคาแท่งก่อนต่ำกว่า BB ล่าง(1.5σ), แท่งเขียว, ADX<25 (Sideways)</li><li><b>C BB Reversal</b>: ปิดต่ำกว่าแถบล่างแล้วกลับเข้ากรอบ, RSI เด้ง, Volume>ค่าเฉลี่ย 20</li><li><b>D Supertrend(10,3)</b>: พลิกเป็นขาขึ้น, ราคา>EMA200, RSI>ค่า</li><li><b>E MACD</b>: Histogram ข้ามเป็นบวก, EMA50>EMA200, ราคา>EMA50, Volume>ค่าเฉลี่ย×ค่า</li><li><b>F Donchian</b>: ปิดสูงกว่า High สูงสุด N แท่งก่อนหน้า, ราคา>EMA200, Volume>1.2×ค่าเฉลี่ย</li></ul>
<b>กฎขาย</b>: Stop Loss / Take Profit ตาม ATR (ทดสอบหลายค่า), ออกตามเวลา (20 หรือ 60 แท่ง) แท่งเดียวชนทั้ง SL และ TP = นับ SL ก่อน, Gap ทะลุ SL = ขายที่ราคาเปิด (เสียเปรียบ)
<p><b>กันการ Overfit</b>: ปรับพารามิเตอร์เฉพาะ Train 60% เลือกด้วย Validation 20% แล้ววัดผลจริงที่ Out-of-sample 20% ครั้งเดียว + ทดสอบ Fee/Slippage ×2. เกณฑ์ผ่าน: Net>0, PF>1.5, Expectancy>0, MaxDD≤10% ของทุน, เทรด≥100, OOS ไม่พังเมื่อเทียบ Train. ถ้าไม่ผ่าน = WAIT / NO TRADE</p>
<p><small>${selfTest()}</small></p><p><small>ข้อจำกัด: เป็นการจำลองย้อนหลัง ไม่รับรองกำไรในอนาคต ไม่ใช่คำแนะนำการลงทุน ขนาดออเดอร์คงที่ (ไม่ทบต้น) ไม่มี Martingale</small></p>`;
